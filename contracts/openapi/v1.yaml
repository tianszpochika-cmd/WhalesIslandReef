openapi: 3.0.3
info:
  title: Whalebone API
  version: 0.1.0
  description: >
    游戏客户端与官网共用的服务端接口契约。
    版本规则：契约先行，改动须三端（game/server/web）同步。
    标注 [待定] 的字段等待需求文档与 token 商业模型定稿。

servers:
  - url: https://api.whalebone.local/api/v1

paths:
  /health:
    get:
      summary: 存活探针（部署/容器健康检查用）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string }

  /auth/steam:
    post:
      summary: Steam 关联登录（主账号）
      description: 客户端用 Steam 鉴权票据换取服务端会话；[待定] 回调细节需 Steamworks 账号就绪
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auth_ticket: { type: string }
      responses:
        '200':
          description: 会话令牌
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }

  /auth/email:
    post:
      summary: 邮箱注册/登录（官网用户）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: 会话令牌

  /agent/chat:
    post:
      summary: 游戏内对话唯一入口
      description: >
        客户端携带 JWT 调用；服务端依次执行：鉴权 → 配额校验 → LLM 网关路由
        （本地 Ollama 优先 → 云端兜底）→ 计量 → 扣减余额 → 流式返回。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [crew_id, player_input]
              properties:
                crew_id: { type: string, description: 船员实例 ID }
                player_input: { type: string, minLength: 1 }
                persona_snapshot: { type: string, description: [待定] 客户端侧 Persona+记忆快照或改为服务端拉取 }
      responses:
        '200':
          description: AgentReply（契约见 agent-reply.schema.json）
          content:
            application/json:
              schema: { $ref: './agent-reply.schema.json' }
        '402':
          description: 点数余额不足（可降级本地/模板对话）
        '429':
          description: 超过限流（RPM/TPM）

  /trade/quote:
    post:
      summary: D3 开发态港口报价
      description: 本地强逻辑与服务端镜像共用的报价字段；正式联机裁决尚未启用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [port_id, commodity_id]
              properties:
                port_id: { type: string }
                commodity_id: { type: string }
                market_stock: { type: integer, minimum: 0, default: 50 }
                event_coefficient: { type: number, minimum: 0.5, maximum: 1.5, default: 1 }
      responses:
        '200':
          description: MarketQuote（字段见 D3 JSON Schema）
          content:
            application/json:
              schema: { $ref: '../d3-trade.schema.json#/$defs/market_quote' }
        '400':
          description: 港口、货物或参数无效

  /trade/order:
    post:
      summary: D3 开发态买卖订单
      description: 仅提供确定性开发态镜像；Unity 本地仍由 TradeEconomySystem 裁决。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../d3-trade.schema.json#/$defs/trade_order'
              properties:
                money: { type: integer, minimum: 0 }
                cargo_count: { type: integer, minimum: 0 }
                cargo_capacity: { type: integer, minimum: 0 }
                market_stock: { type: integer, minimum: 0, default: 50 }
                event_coefficient: { type: number, minimum: 0.5, maximum: 1.5, default: 1 }
      responses:
        '200':
          description: TradeResult（字段见 D3 JSON Schema）
          content:
            application/json:
              schema: { $ref: '../d3-trade.schema.json#/$defs/trade_result' }
        '400':
          description: 订单参数无效

  /voyage/settle:
    post:
      summary: D3 开发态航程结算镜像
      description: 服务端只验证并回显结算快照，不取代游戏端 VoyageSettlementSystem 的数值裁决。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [succeeded, origin_id, destination_id, days_elapsed, events, water_remaining, food_remaining, hull_remaining]
              properties:
                succeeded: { type: boolean }
                origin_id: { type: string }
                destination_id: { type: string }
                days_elapsed: { type: integer, minimum: 0 }
                events: { type: array, items: { type: string } }
                water_remaining: { type: integer, minimum: 0 }
                food_remaining: { type: integer, minimum: 0 }
                hull_remaining: { type: integer, minimum: 0 }
                message: { type: string }
      responses:
        '200':
          description: VoyageSettlement（字段见 D3 JSON Schema）
          content:
            application/json:
              schema: { $ref: '../d3-trade.schema.json#/$defs/voyage_settlement' }

  /factions/state:
    post:
      summary: D4 开发态势力状态镜像
      description: 客户端 D4FactionSystem 仍是本地单机裁决者；服务端只校验并回显状态字段。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../d4-content.schema.json#/$defs/faction_state' }
      responses:
        '200':
          description: FactionState
          content:
            application/json:
              schema: { $ref: '../d4-content.schema.json#/$defs/faction_state' }

  /combat/resolve:
    post:
      summary: D4 开发态炮战结算镜像
      description: 不取代客户端 D4CombatSystem 的命中和伤害裁决。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../d4-content.schema.json#/$defs/combat_state' }
      responses:
        '200':
          description: CombatState
          content:
            application/json:
              schema: { $ref: '../d4-content.schema.json#/$defs/combat_state' }

  /animals/encounter:
    post:
      summary: D4 动物遭遇镜像
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../d4-content.schema.json#/$defs/ecology_state' }
      responses:
        '200':
          description: EcologyState
          content:
            application/json:
              schema: { $ref: '../d4-content.schema.json#/$defs/ecology_state' }

  /medical/treat:
    post:
      summary: D4 医疗结算镜像
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../d4-content.schema.json#/$defs/health_state' }
      responses:
        '200':
          description: HealthState
          content:
            application/json:
              schema: { $ref: '../d4-content.schema.json#/$defs/health_state' }

  /mainline/advance:
    post:
      summary: D4 主线推进镜像
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../d4-content.schema.json#/$defs/mainline_state' }
      responses:
        '200':
          description: MainlineState
          content:
            application/json:
              schema: { $ref: '../d4-content.schema.json#/$defs/mainline_state' }

  /wallet:
    get:
      summary: 玩家点数余额与用量（用户中心/游戏内展示）
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  points_balance: { type: number, description: 玩家点数余额 }
                  monthly_usage_tokens: { type: integer, description: 本月已消耗上游 token }
                  monthly_limit_tokens: { type: integer, description: 本月额度 [待定] }

  /billing/orders:
    post:
      summary: 创建购买点数订单（Steam 钱包 / 官网支付）
      description: '[待定] 定价模型与支付渠道（Steam 钱包 webhook / 微信 / 支付宝）待 token 商业模型定稿'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan: { type: string, description: 点数套餐 ID [待定] }
      responses:
        '200':
          description: 支付参数（渠道相关）

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
